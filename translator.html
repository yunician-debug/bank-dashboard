<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF · URL 한국어 번역기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #16a34a;
            --border: #e2e8f0;
            --muted: #94a3b8;
            --text: #1e293b;
            --card-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', Roboto, sans-serif;
            background: #f1f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            box-shadow: 0 2px 10px rgba(79,70,229,0.35);
        }
        .header-icon { font-size: 1.6rem; }
        .header-text h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.3px; }
        .header-text p { font-size: 0.75rem; opacity: 0.75; margin-top: 1px; }
        .header-badge {
            margin-left: auto;
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* ── Input Bar ── */
        .input-bar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        #fileInput { display: none; }
        .file-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f0fdf4;
            border: 1.5px dashed #4ade80;
            color: var(--success);
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.84rem;
            font-weight: 600;
            transition: all 0.15s;
            white-space: nowrap;
            user-select: none;
        }
        .file-btn:hover { background: #dcfce7; border-color: #22c55e; }
        .file-btn.has-file { background: #dcfce7; border-style: solid; border-color: #22c55e; }
        .file-name-tag {
            font-size: 0.78rem;
            color: var(--muted);
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .or-divider { color: var(--muted); font-size: 0.82rem; flex-shrink: 0; }
        .url-input {
            flex: 1;
            padding: 8px 13px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.88rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .url-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        .url-input::placeholder { color: #cbd5e1; }
        .go-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            transition: background 0.15s, transform 0.1s;
            white-space: nowrap;
        }
        .go-btn:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-1px); }
        .go-btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; }

        /* ── Column Headers (sticky) ── */
        .col-headers {
            display: flex;
            flex-shrink: 0;
            background: white;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .col-header {
            flex: 1;
            padding: 9px 18px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .col-header-left { background: #fafafa; color: var(--muted); border-right: 5px solid #c7d2fe; }
        .col-header-right { background: #e0f2fe; color: #0369a1; }

        /* ── Viewer: single scroll container ── */
        .viewer {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .viewer::-webkit-scrollbar { width: 8px; }
        .viewer::-webkit-scrollbar-track { background: #f1f5f9; }
        .viewer::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .viewer::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* ── Placeholder ── */
        .placeholder-row {
            display: flex;
            height: 100%;
            min-height: calc(100vh - 200px);
        }
        .placeholder-cell {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--muted);
            padding: 40px;
        }
        .placeholder-cell:first-child { border-right: 5px solid #c7d2fe; background: #fafafa; }
        .placeholder-cell:last-child { background: #f0f9ff; }
        .placeholder-icon { font-size: 3.5rem; margin-bottom: 16px; opacity: 0.35; }
        .placeholder-title { font-size: 1rem; font-weight: 600; margin-bottom: 6px; color: #64748b; }
        .placeholder-desc { font-size: 0.83rem; line-height: 1.6; }

        /* ── Page Pair Row ── */
        .page-pair {
            display: flex;
            border-bottom: 2px solid #e2e8f0;
        }
        .page-pair:last-child { border-bottom: none; }

        .pair-left {
            flex: 1;
            padding: 24px 20px;
            background: #ffffff;
            border-right: 5px solid #c7d2fe;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .pair-right {
            flex: 1;
            padding: 24px 20px;
            background: #f8fbff;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* ── PDF Canvas ── */
        .pdf-canvas {
            max-width: 100%;
            display: block;
            border-radius: 4px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.13);
        }
        .page-label {
            font-size: 0.72rem;
            color: var(--muted);
            background: #f1f5f9;
            padding: 3px 12px;
            border-radius: 10px;
        }

        /* ── Translation content ── */
        .trans-page-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #93c5fd;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #bfdbfe;
        }
        .trans-body {
            line-height: 1.85;
            font-size: 0.93rem;
            color: var(--text);
        }

        /* ── URL content ── */
        .url-h { font-weight: 700; font-size: 0.95rem; color: #1e293b; margin-bottom: 4px; }
        .url-p { font-size: 0.9rem; color: #334155; line-height: 1.75; }
        .url-title-area {
            margin-bottom: 4px;
            padding-bottom: 8px;
        }
        .url-title-area h2 { font-size: 1.05rem; color: #1e293b; margin-bottom: 4px; }
        .url-meta { font-size: 0.75rem; color: var(--muted); }

        /* ── Spinner ── */
        .spin {
            display: inline-block;
            width: 13px;
            height: 13px;
            border: 2px solid #bfdbfe;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: rotate 0.65s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes rotate { to { transform: rotate(360deg); } }

        /* ── Status Bar ── */
        .status-bar {
            height: 26px;
            background: #f8fafc;
            border-top: 1px solid var(--border);
            padding: 0 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; flex-shrink: 0; }
        .status-dot.active { background: #22c55e; animation: pulse 1.2s ease-in-out infinite; }
        .status-dot.error { background: #ef4444; animation: none; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.8); }
        }
        .status-text { font-size: 0.75rem; color: var(--muted); flex: 1; }
        .progress-track { width: 160px; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden; flex-shrink: 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #a78bfa); border-radius: 2px; transition: width 0.4s ease; width: 0%; }

        /* ── API Key Bar ── */
        .apikey-bar {
            background: #fffbeb;
            border-bottom: 1px solid #fde68a;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .apikey-label { font-size: 0.8rem; font-weight: 600; color: #92400e; white-space: nowrap; }
        .apikey-input {
            flex: 1;
            padding: 6px 12px;
            border: 1.5px solid #fcd34d;
            border-radius: 6px;
            font-size: 0.83rem;
            font-family: monospace;
            color: #1e293b;
            background: white;
            outline: none;
            max-width: 460px;
        }
        .apikey-input:focus { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,0.15); }
        .apikey-link {
            font-size: 0.78rem;
            color: #d97706;
            text-decoration: none;
            white-space: nowrap;
            font-weight: 600;
        }
        .apikey-link:hover { text-decoration: underline; }
        .apikey-bar.ok { background: #f0fdf4; border-bottom-color: #86efac; }
        .apikey-bar.ok .apikey-label { color: #166534; }

        body.dragover .input-bar { background: #eff6ff; }
        body.dragover .file-btn { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <span class="header-icon">🌐</span>
        <div class="header-text">
            <h1>한국어 번역기</h1>
            <p>PDF 파일 또는 URL을 업로드하면 한국어로 번역합니다</p>
        </div>
        <div class="header-badge">Claude AI</div>
    </div>

    <!-- API Key Bar -->
    <div class="apikey-bar" id="apikeyBar">
        <span class="apikey-label">🔑 Anthropic API Key</span>
        <input class="apikey-input" id="apikeyInput" type="password"
               placeholder="sk-ant-api03-…  (입력 후 자동 저장됩니다)"/>
        <a class="apikey-link" href="https://console.anthropic.com/settings/keys" target="_blank">키 발급 →</a>
    </div>

    <!-- Input Bar -->
    <div class="input-bar">
        <input type="file" id="fileInput" accept=".pdf">
        <label class="file-btn" id="fileBtn" for="fileInput">
            <span>📄</span> PDF 파일 선택
        </label>
        <span class="file-name-tag" id="fileNameTag">선택된 파일 없음</span>
        <span class="or-divider">또는</span>
        <input class="url-input" id="urlInput" type="text"
               placeholder="https://example.com  —  URL을 입력하세요"/>
        <button class="go-btn" id="goBtn" onclick="handleGo()">번역 시작 →</button>
    </div>

    <!-- Column Headers (sticky inside viewer) -->
    <div class="col-headers">
        <div class="col-header col-header-left">📄 원본</div>
        <div class="col-header col-header-right">🇰🇷 한국어 번역</div>
    </div>

    <!-- Single scroll container -->
    <div class="viewer" id="viewer">
        <!-- Placeholder -->
        <div class="placeholder-row" id="placeholder">
            <div class="placeholder-cell">
                <div class="placeholder-icon">📄</div>
                <div class="placeholder-title">원본 문서</div>
                <div class="placeholder-desc">PDF 파일을 업로드하거나<br>URL을 입력한 후<br>번역 시작 버튼을 눌러주세요</div>
            </div>
            <div class="placeholder-cell">
                <div class="placeholder-icon">🇰🇷</div>
                <div class="placeholder-title">번역 결과</div>
                <div class="placeholder-desc">번역된 한국어 내용이<br>여기에 표시됩니다</div>
            </div>
        </div>

        <!-- Page pairs inserted here by JS -->
        <div id="pairsContainer"></div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">준비</span>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const pairsContainer = document.getElementById('pairsContainer');
    const placeholder    = document.getElementById('placeholder');
    const goBtn          = document.getElementById('goBtn');
    const fileBtn        = document.getElementById('fileBtn');
    const fileNameTag    = document.getElementById('fileNameTag');
    const apikeyInput    = document.getElementById('apikeyInput');
    const apikeyBar      = document.getElementById('apikeyBar');

    // ─── API Key: load from localStorage ─────────────────────────────
    const savedKey = localStorage.getItem('anthropic_api_key');
    if (savedKey) { apikeyInput.value = savedKey; apikeyBar.classList.add('ok'); }

    apikeyInput.addEventListener('input', () => {
        const v = apikeyInput.value.trim();
        if (v) { localStorage.setItem('anthropic_api_key', v); apikeyBar.classList.add('ok'); }
        else   { localStorage.removeItem('anthropic_api_key'); apikeyBar.classList.remove('ok'); }
    });

    // ─── File input ───────────────────────────────────────────────────
    document.getElementById('fileInput').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        fileNameTag.textContent = file.name;
        fileBtn.classList.add('has-file');
        document.getElementById('urlInput').value = '';
    });

    document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragover'); });
    document.addEventListener('dragleave', () => document.body.classList.remove('dragover'));
    document.addEventListener('drop', e => {
        e.preventDefault();
        document.body.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file && file.type === 'application/pdf') {
            const dt = new DataTransfer();
            dt.items.add(file);
            document.getElementById('fileInput').files = dt.files;
            fileNameTag.textContent = file.name;
            fileBtn.classList.add('has-file');
            document.getElementById('urlInput').value = '';
        }
    });

    // ─── Status helpers ───────────────────────────────────────────────
    function setStatus(text, pct = null, state = 'active') {
        document.getElementById('statusText').textContent = text;
        document.getElementById('statusDot').className = 'status-dot ' + state;
        if (pct !== null) document.getElementById('progressFill').style.width = pct + '%';
    }
    function setIdle(text = '준비') {
        document.getElementById('statusText').textContent = text;
        document.getElementById('statusDot').className = 'status-dot';
        document.getElementById('progressFill').style.width = '0%';
    }

    // ─── Entry ───────────────────────────────────────────────────────
    async function handleGo() {
        const file   = document.getElementById('fileInput').files[0];
        const url    = document.getElementById('urlInput').value.trim();
        const apiKey = apikeyInput.value.trim();

        if (!file && !url) { alert('PDF 파일을 선택하거나 URL을 입력해주세요.'); return; }
        if (!apiKey)        { alert('Anthropic API Key를 입력해주세요.'); apikeyInput.focus(); return; }

        pairsContainer.innerHTML = '';
        placeholder.style.display = 'none';
        goBtn.disabled = true;

        try {
            if (file) await handlePDF(file, apiKey);
            else      await handleURL(url, apiKey);
            setStatus('번역 완료!', 100, 'active');
            setTimeout(() => setIdle('완료'), 2500);
        } catch (err) {
            setStatus('오류: ' + err.message, 0, 'error');
        } finally {
            goBtn.disabled = false;
        }
    }

    // ─── Create a page pair row ───────────────────────────────────────
    function createPair(leftHTML, rightPlaceholderLabel) {
        const row = document.createElement('div');
        row.className = 'page-pair';

        const left = document.createElement('div');
        left.className = 'pair-left';
        left.innerHTML = leftHTML;

        const right = document.createElement('div');
        right.className = 'pair-right';
        right.innerHTML = `
            <div class="trans-page-label">${rightPlaceholderLabel}</div>
            <div class="trans-body"><span class="spin"></span>번역 중…</div>
        `;

        row.appendChild(left);
        row.appendChild(right);
        pairsContainer.appendChild(row);
        return right; // caller fills in translation
    }

    function fillRight(rightEl, label, html) {
        rightEl.innerHTML = `<div class="trans-page-label">${label}</div><div class="trans-body">${html}</div>`;
    }

    // ─── PDF ──────────────────────────────────────────────────────────
    async function handlePDF(file, apiKey) {
        setStatus('PDF 로딩 중…', 5);
        const buf = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        const total = pdf.numPages;

        for (let i = 1; i <= total; i++) {
            const pct = Math.round(((i - 0.8) / total) * 90) + 5;
            setStatus(`${i} / ${total} 페이지 처리 중…`, pct);

            const page = await pdf.getPage(i);

            // Render canvas
            const viewer = document.getElementById('viewer');
            const maxW   = viewer.clientWidth / 2 - 48;
            const native = page.getViewport({ scale: 1 });
            const scale  = Math.min(1.6, maxW / native.width);
            const vp     = page.getViewport({ scale });

            const canvas = document.createElement('canvas');
            canvas.className = 'pdf-canvas';
            canvas.width  = vp.width;
            canvas.height = vp.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

            // Build left HTML: we'll append the canvas after creating the row
            const leftHTML = `<div class="pdf-canvas-slot"></div>
                              <div class="page-label">페이지 ${i} / ${total}</div>`;
            const rightEl = createPair(leftHTML, `페이지 ${i}`);

            // Insert canvas into the slot
            const slot = rightEl.previousElementSibling.querySelector('.pdf-canvas-slot');
            slot.appendChild(canvas);

            // Extract text & translate
            const tc      = await page.getTextContent();
            const rawText = tc.items.map(it => it.str).join(' ').trim();

            if (rawText) {
                try {
                    const result = await translateText(rawText, apiKey);
                    fillRight(rightEl, `페이지 ${i}`, result);
                } catch (e) {
                    fillRight(rightEl, `페이지 ${i}`, `<span style="color:#f87171">번역 실패: ${e.message}</span>`);
                }
            } else {
                fillRight(rightEl, `페이지 ${i}`, '<span style="color:#94a3b8;font-style:italic">텍스트 없음 (이미지 전용 페이지)</span>');
            }
        }
    }

    // ─── URL ─────────────────────────────────────────────────────────
    async function handleURL(url, apiKey) {
        setStatus('URL 콘텐츠 가져오는 중…', 8);

        const proxies = [
            `https://corsproxy.io/?${encodeURIComponent(url)}`,
            `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
        ];

        let html = null;
        for (const proxy of proxies) {
            try {
                const ctrl = new AbortController();
                const tid  = setTimeout(() => ctrl.abort(), 12000);
                const resp = await fetch(proxy, { signal: ctrl.signal });
                clearTimeout(tid);
                if (resp.ok) { html = await resp.text(); break; }
            } catch { /* try next */ }
        }
        if (!html) throw new Error('URL을 가져올 수 없습니다. CORS 제한 또는 네트워크 문제.');

        setStatus('HTML 파싱 중…', 18);
        const parser = new DOMParser();
        const doc    = parser.parseFromString(html, 'text/html');
        ['script','style','noscript','nav','footer','aside','header','iframe','figure','svg','form','button']
            .forEach(tag => doc.querySelectorAll(tag).forEach(el => el.remove()));

        const siteTitle = doc.querySelector('title')?.textContent?.trim() || url;

        const nodes = [...doc.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,blockquote,td,th')]
            .filter(el => el.textContent.trim().length > 12);

        const units = [];
        let acc = '';
        for (const el of nodes) {
            const tag  = el.tagName.toLowerCase();
            const text = el.textContent.replace(/\s+/g, ' ').trim();
            if (/^h[1-6]$/.test(tag)) {
                if (acc.trim()) { units.push({ type: 'para', text: acc.trim() }); acc = ''; }
                units.push({ type: 'heading', text });
            } else {
                acc += ' ' + text;
                if (acc.length > 700) { units.push({ type: 'para', text: acc.trim() }); acc = ''; }
            }
        }
        if (acc.trim()) units.push({ type: 'para', text: acc.trim() });
        if (units.length === 0) {
            const fb = doc.body?.textContent.replace(/\s+/g,' ').trim() || '';
            if (fb.length < 20) throw new Error('번역할 텍스트를 찾을 수 없습니다.');
            units.push({ type: 'para', text: fb.slice(0, 3000) });
        }

        // Title pair
        const titleLeftHTML = `<div class="url-title-area">
            <h2>${escHtml(siteTitle)}</h2>
            <div class="url-meta">${escHtml(url)}</div>
        </div>`;
        const titleRight = createPair(titleLeftHTML, '제목');
        try {
            const t = await translateText(siteTitle, apiKey);
            fillRight(titleRight, '제목', `<strong>${t}</strong>`);
        } catch {
            fillRight(titleRight, '제목', `<strong>${escHtml(siteTitle)}</strong>`);
        }

        // Content pairs
        for (let i = 0; i < units.length; i++) {
            const pct = Math.round(((i + 1) / units.length) * 78) + 18;
            setStatus(`단락 ${i + 1} / ${units.length} 번역 중…`, pct);

            const u   = units[i];
            const idx = i + 1;
            const leftHTML = u.type === 'heading'
                ? `<div class="url-h">${escHtml(u.text)}</div>`
                : `<div class="url-p">${escHtml(u.text)}</div>`;
            const label = u.type === 'heading' ? `제목 ${idx}` : `단락 ${idx}`;
            const rightEl = createPair(leftHTML, label);

            try {
                const translated = await translateText(u.text, apiKey);
                fillRight(rightEl, label,
                    u.type === 'heading'
                        ? `<strong>${translated}</strong>`
                        : translated);
            } catch {
                fillRight(rightEl, label, '<span style="color:#f87171">번역 실패</span>');
            }
        }
    }

    // ─── Translation: Claude via local server ─────────────────────────
    async function translateText(text, apiKey) {
        if (!text || text.trim().length < 2) return text;

        const resp = await fetch('/translate', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ text: text.trim(), apiKey })
        });

        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || `서버 오류 ${resp.status}`);
        return data.translated;
    }
    function escHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    </script>
</body>
</html>
